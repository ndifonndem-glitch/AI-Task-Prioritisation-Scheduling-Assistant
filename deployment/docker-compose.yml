version: '3.8'

# Base and fine-tuned must be two different model files. Pointing both services at one
# GGUF makes the Task 10 comparison a model measured against itself, which is what an
# earlier revision of this file did. The two --model paths below must never be equal;
# tests/test_router_registration.py asserts that, and also queries the running
# endpoints, because identical configuration strings alone prove nothing about which
# weights are loaded.

services:
  ml-prediction-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: ml_task_priority_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: always

  llm-router-base:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: qwen_gguf_router_base
    ports:
      - "8082:8082"
    volumes:
      - ../llm/export:/models:ro
    command:
      - "--model"
      - "/models/qwen2.5-0.5b-instruct-base.Q4_K_M.gguf"
      - "--alias"
      - "qwen05b-base"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
      - "--ctx-size"
      - "16384"
      - "--jinja"
    restart: always

  llm-router-finetuned:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: qwen_gguf_router_finetuned
    ports:
      - "8081:8081"
    volumes:
      - ../llm/export:/models:ro
    command:
      - "--model"
      - "/models/qwen05b-taskextract.Q4_K_M.gguf"
      - "--alias"
      - "qwen05b-taskextract"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--ctx-size"
      - "16384"
      - "--jinja"
    restart: always
